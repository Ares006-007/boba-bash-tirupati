<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boba Bash Tirupati — 21 September 2026</title>
  <meta name="description" content="Boba Bash is coming to Tirupati! Join us on 21 September 2026 at Mohan Babu University for a day packed with boba, people, creativity and unforgettable moments.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="site-wrapper">
    <header class="header">
      <img src="assets/logofull.png" alt="Boba Bash Logo" class="logo">
      <img src="assets/hack club pin.jpeg" alt="Hack Club Pin" class="pin">
    </header>
    
    <main class="bento-grid">
      <!-- Hero -->
      <section class="card hero-section grid-span-full">
        <img src="assets/mock (3).webp" alt="Boba Bash Tirupati Hero Graphic" class="hero-image">
      </section>

      <!-- Info Cards Row -->
      <section class="card info-card">
        <img src="assets/date card.jpeg" alt="When: 21 September 2026" loading="lazy">
      </section>
      <section class="card info-card">
        <img src="assets/venue card.jpeg" alt="Where: Mohan Babu University" loading="lazy">
      </section>
      
      <!-- Content & Gallery Row -->
      <section class="card content-card grid-span-2">
        <img src="assets/contentcard.jpeg" alt="Bring your people. Boba Bash Tirupati is happening..." loading="lazy">
      </section>
      <section class="card gallery-card">
        <img src="assets/mock.webp" alt="Event photo gallery 1" loading="lazy">
      </section>
      <section class="card gallery-card">
        <img src="assets/mock (2).webp" alt="Event photo gallery 2" loading="lazy">
      </section>

      <!-- Illustrations Row -->
      <section class="card raccoon-card">
        <img src="assets/raccoon-boba-CiAIXHwE.webp" alt="Raccoon drinking boba" loading="lazy">
      </section>
      <section class="card raccoon-card">
        <img src="assets/raccoon-build-UDtVXbFF.webp" alt="Raccoon building hardware" loading="lazy">
      </section>
      <section class="card raccoon-card">
        <img src="assets/raccoon-signup-CmhNPqMA.webp" alt="Raccoon signing up for event" loading="lazy">
      </section>
      <section class="card boba-cup-card">
        <img src="assets/boba cup.png" alt="Boba cup decoration" loading="lazy">
      </section>

      <!-- CTA -->
      <section class="card bash-now grid-span-full">
        <img src="assets/bash now card.jpeg" alt="Ready to Bash? Join the bash ->" loading="lazy">
      </section>
    </main>
  </div>
</body>
</html>
