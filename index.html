<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boba Bash Tirupati — 21 September 2026</title>
  <meta name="description" content="Boba Bash is coming to Tirupati! Join us on 21 September 2026 at Mohan Babu University for a day packed with boba, people, creativity and unforgettable moments.">
  <meta property="og:title" content="Boba Bash Tirupati — 21 September 2026">
  <meta property="og:description" content="Get ready for a day packed with boba, people, creativity and unforgettable moments. Tirupati, we're bringing the Boba Bash to you!">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="#" class="header-logo" aria-label="Boba Bash Home">
        <img src="https://boba-bash-brand.vercel.app/pics/cup.png" alt="Boba Bash cup" class="header-cup" width="36" height="36">
        <span class="header-logo-text font-display">boba bash</span>
      </a>
      <span class="header-pill font-display">TIRUPATI &bull; 2026</span>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="hero-inner">
      <!-- Tirupati silhouette artwork (SVG behind everything) -->
      <div class="hero-silhouettes" aria-hidden="true">
        <svg class="silhouette-svg" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
          <!-- Sun -->
          <circle cx="820" cy="80" r="40" fill="#274156" opacity="0.06"/>
          <!-- Moon crescent -->
          <circle cx="140" cy="70" r="22" fill="#274156" opacity="0.05"/>
          <circle cx="150" cy="64" r="18" fill="#6fbbe2" opacity="0.05"/>
          <!-- Tirupati Hills -->
          <path d="M0 520 L0 400 Q60 340 140 360 Q200 320 280 350 Q340 300 420 340 Q500 290 580 330 Q640 300 720 340 Q800 310 880 350 Q940 370 960 380 L960 520 Z" fill="#274156" opacity="0.07"/>
          <!-- Temple Tower (Gopuram) -->
          <path d="M700 380 L700 240 L710 220 L715 200 L718 180 L720 160 L722 180 L725 200 L730 220 L740 240 L740 380 Z" fill="#274156" opacity="0.08"/>
          <!-- Temple tiers -->
          <rect x="695" y="260" width="50" height="8" rx="2" fill="#274156" opacity="0.06"/>
          <rect x="698" y="240" width="44" height="6" rx="2" fill="#274156" opacity="0.06"/>
          <rect x="702" y="222" width="36" height="5" rx="2" fill="#274156" opacity="0.06"/>
          <!-- Waterfall -->
          <path d="M160 360 Q162 380 158 400 Q163 420 160 440 Q157 460 161 480 L165 480 Q162 460 166 440 Q163 420 166 400 Q162 380 165 360 Z" fill="#274156" opacity="0.06"/>
          <!-- Trees -->
          <ellipse cx="80" cy="380" rx="30" ry="40" fill="#274156" opacity="0.05"/>
          <rect x="77" y="400" width="6" height="25" fill="#274156" opacity="0.05"/>
          <ellipse cx="520" cy="370" rx="22" ry="30" fill="#274156" opacity="0.04"/>
          <rect x="518" y="385" width="5" height="20" fill="#274156" opacity="0.04"/>
          <ellipse cx="890" cy="365" rx="25" ry="35" fill="#274156" opacity="0.05"/>
          <rect x="887" y="385" width="6" height="22" fill="#274156" opacity="0.05"/>
          <!-- Elephant silhouette -->
          <g transform="translate(350, 400)" opacity="0.05">
            <ellipse cx="30" cy="20" rx="28" ry="18" fill="#274156"/>
            <circle cx="5" cy="10" r="10" fill="#274156"/>
            <path d="M-5 10 Q-10 30 -6 45 L-2 45 Q0 30 2 15" fill="#274156"/>
            <rect x="10" y="35" width="6" height="18" rx="3" fill="#274156"/>
            <rect x="22" y="35" width="6" height="18" rx="3" fill="#274156"/>
            <rect x="38" y="35" width="6" height="18" rx="3" fill="#274156"/>
            <rect x="48" y="35" width="6" height="18" rx="3" fill="#274156"/>
          </g>
          <!-- Cheetah silhouette -->
          <g transform="translate(600, 430)" opacity="0.04">
            <ellipse cx="20" cy="10" rx="22" ry="8" fill="#274156"/>
            <circle cx="0" cy="5" r="6" fill="#274156"/>
            <rect x="5" y="16" width="4" height="14" rx="2" fill="#274156"/>
            <rect x="15" y="16" width="4" height="14" rx="2" fill="#274156"/>
            <rect x="28" y="16" width="4" height="14" rx="2" fill="#274156"/>
            <rect x="35" y="16" width="4" height="14" rx="2" fill="#274156"/>
            <path d="M42 10 Q55 8 60 12" stroke="#274156" stroke-width="2" fill="none"/>
          </g>
        </svg>
      </div>

      <div class="hero-content">
        <!-- Badge -->
        <div class="hero-badge">
          <img src="https://boba-bash-brand.vercel.app/pics/cup.png" alt="" class="badge-cup" width="24" height="24">
          <span class="badge-text font-body">THE BOBA BASH IS COMING</span>
        </div>

        <!-- Title -->
        <h1 class="hero-title font-display">
          <span class="title-boba">Boba</span>
          <span class="title-bash">Bash</span>
        </h1>
        <p class="hero-city font-display">TIRUPATI</p>

        <!-- Description -->
        <p class="hero-desc font-body">
          Get ready for a day packed with boba, people, creativity and unforgettable moments. Tirupati, we're bringing the Boba Bash to you!
        </p>
      </div>

      <!-- Real Boba Cup -->
      <div class="hero-cup-wrapper">
        <img src="https://boba-bash-brand.vercel.app/pics/cup.png" alt="Boba Bash Cup" class="hero-cup-img">
      </div>
    </div>
  </section>

  <!-- Event Info Cards -->
  <section class="info-cards" id="info-cards">
    <div class="info-cards-inner">

      <!-- Card 1: When -->
      <div class="info-card">
        <div class="card-silhouette" aria-hidden="true">
          <svg viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 180 L0 140 Q40 110 90 130 Q140 100 190 125 Q230 110 280 130 L280 180 Z" fill="#3d2b18" opacity="0.04"/>
            <circle cx="240" cy="30" r="18" fill="#3d2b18" opacity="0.04"/>
          </svg>
        </div>
        <span class="card-label font-body">WHEN</span>
        <span class="card-value font-display">21 September<br>2026</span>
      </div>

      <!-- Card 2: Where -->
      <div class="info-card">
        <div class="card-silhouette" aria-hidden="true">
          <svg viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Mini temple -->
            <path d="M200 180 L200 100 L207 85 L210 70 L212 60 L214 70 L217 85 L224 100 L224 180 Z" fill="#3d2b18" opacity="0.05"/>
            <rect x="196" y="110" width="32" height="4" rx="1" fill="#3d2b18" opacity="0.04"/>
            <rect x="198" y="98" width="28" height="3" rx="1" fill="#3d2b18" opacity="0.04"/>
          </svg>
        </div>
        <span class="card-label font-body">WHERE</span>
        <span class="card-value font-display">Mohan Babu<br>University</span>
      </div>

      <!-- Card 3: City -->
      <div class="info-card">
        <div class="card-silhouette" aria-hidden="true">
          <svg viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Trees and hills -->
            <ellipse cx="60" cy="150" rx="20" ry="28" fill="#3d2b18" opacity="0.04"/>
            <rect x="58" y="160" width="4" height="16" fill="#3d2b18" opacity="0.04"/>
            <path d="M0 180 L0 155 Q70 130 140 150 Q200 135 280 150 L280 180 Z" fill="#3d2b18" opacity="0.04"/>
            <!-- Waterfall hint -->
            <path d="M230 120 Q232 140 229 155 L233 155 Q231 140 234 120 Z" fill="#3d2b18" opacity="0.04"/>
          </svg>
        </div>
        <span class="card-label font-body">CITY</span>
        <span class="card-value font-display">Tirupati,<br>Andhra Pradesh</span>
      </div>

    </div>
  </section>

  <!-- Details -->
  <section class="details" id="details">
  </section>

  <!-- CTA -->
  <section class="cta" id="cta">
  </section>

  <!-- Footer -->
  <footer class="site-footer" id="site-footer">
  </footer>

</body>
</html>
