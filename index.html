<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boba Bash Tirupati — 21 September 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="site-wrapper">
    <!-- Header -->
    <header class="header">
      <img src="assets/logofull.png" alt="Boba Bash Logo" class="logo">
    </header>
    
    <main class="main-content">
      <!-- Hero Section -->
      <section class="section-hero">
        <img src="assets/hero.jpeg.png" alt="Boba Bash Tirupati Hero Graphic" class="full-image">
      </section>

      <!-- Info Cards Row -->
      <section class="section-info">
        <div class="info-card">
          <img src="assets/date card.jpeg" alt="When: 21 September 2026" class="full-image">
        </div>
        <div class="info-card">
          <img src="assets/venue card.jpeg" alt="Where: Mohan Babu University" class="full-image">
        </div>
        <div class="accent-cup">
          <img src="assets/boba cup.png" alt="Boba cup illustration" class="full-image">
        </div>
      </section>
      
      <!-- Content Row -->
      <section class="section-content">
        <img src="assets/contentcard.jpeg" alt="Bring your people. Boba Bash Tirupati is happening..." class="full-image">
      </section>

      <!-- CTA Row -->
      <section class="section-cta">
        <img src="assets/bash now card.jpeg" alt="Ready to Bash? Join the bash" class="full-image">
      </section>
    </main>
  </div>
</body>
</html>
